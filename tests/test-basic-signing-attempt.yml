name: Test basic signing attempt
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to sign
        run: echo "hello sigstore" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "/tmp/test-artifact.txt"
          release-signing-artifacts: "false"
          internal-be-careful-debug: "true"

      - name: Assert action ran (signing fails without OIDC token in harness, but setup must succeed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under the act harness, there is no OIDC token available, so signing
          # will fail. We accept either success (if somehow a token is available)
          # or failure (expected: no OIDC token). What we must NOT see is a
          # setup failure (e.g. Python not found, pip install failed).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: signing succeeded (OIDC token was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no OIDC token available in harness, as expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
