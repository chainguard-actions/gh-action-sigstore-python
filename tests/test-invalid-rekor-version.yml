name: Test invalid rekor-version error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to sign
        run: echo "dummy content" > /tmp/dummy.txt

      - name: Run action with invalid rekor-version
        id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "/tmp/dummy.txt"
          rekor-version: "99"
          release-signing-artifacts: "false"

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid rekor-version '99'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid rekor-version"
