name: Test nonexistent file input is rejected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "/tmp/this-file-does-not-exist-at-all-12345.txt"
          release-signing-artifacts: "false"

      - name: Assert action failed due to nonexistent file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected nonexistent file input"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when input file does not exist"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
