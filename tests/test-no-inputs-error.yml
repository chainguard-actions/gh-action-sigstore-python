name: Test no inputs error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no inputs and release-signing-artifacts disabled
        id: action
        uses: .
        with:
          inputs: ""
          release-signing-artifacts: "false"
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no inputs provided and release-signing-artifacts is false"
            exit 1
          fi
          echo "PASS: action correctly failed with no inputs"
