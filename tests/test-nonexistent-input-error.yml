name: Test nonexistent input error
# When an input glob doesn't expand to any files,
# the action should exit with a non-zero code and print a helpful error message.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with nonexistent file expecting failure
        id: action
        uses: .
        with:
          inputs: "/tmp/this-file-does-not-exist-at-all-12345.txt"
          release-signing-artifacts: "false"
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when input file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when input file does not exist"
