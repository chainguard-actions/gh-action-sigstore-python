name: Test basic sign attempt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to sign
        run: echo "dummy content for signing test" > /tmp/test-artifact.txt

      - name: Run action to sign a file (will fail without OIDC token)
        id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "/tmp/test-artifact.txt"
          release-signing-artifacts: "false"
          internal-be-careful-debug: "true"

      - name: Assert action ran (setup succeeded, signing failed gracefully without OIDC)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action signed successfully (unexpected but valid)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without OIDC token in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
