name: Test empty glob expansion error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "/tmp/nonexistent-file-that-does-not-exist-*.whl"
          release-signing-artifacts: "false"

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when glob expands to no files"
            exit 1
          fi
          echo "PASS: action correctly failed when glob expands to no files"
