name: Test cert-identity without verify error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to sign
        run: echo "hello world" > /tmp/test-artifact.txt

      - name: Run action with cert-identity but verify disabled
        id: action
        uses: .
        with:
          inputs: "/tmp/test-artifact.txt"
          verify: "false"
          verify-cert-identity: "https://github.com/example/repo/.github/workflows/release.yml@refs/heads/main"
          release-signing-artifacts: "false"
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when cert-identity is set without verify: true"
            exit 1
          fi
          echo "PASS: action correctly failed when verify-cert-identity is set without verify"
