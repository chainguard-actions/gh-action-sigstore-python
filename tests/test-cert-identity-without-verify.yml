name: Test cert-identity without verify error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to sign
        run: echo "hello sigstore" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "/tmp/test-artifact.txt"
          verify: "false"
          verify-cert-identity: "user@example.com"
          release-signing-artifacts: "false"

      - name: Assert action failed due to cert-identity without verify
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when verify-cert-identity is set but verify=false"
            exit 1
          fi
          echo "PASS: action correctly failed when verify-cert-identity was set without verify=true"
