name: Test invalid rekor-version error
# When an invalid rekor-version is provided (not 1 or 2),
# the action should exit with a non-zero code and print a helpful error message.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to sign
        run: echo "hello" > /tmp/dummy.txt

      - name: Run action with invalid rekor-version expecting failure
        id: action
        uses: .
        with:
          inputs: "/tmp/dummy.txt"
          rekor-version: "99"
          release-signing-artifacts: "false"
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid rekor-version '99'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid rekor-version"
